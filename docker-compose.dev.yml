# Dev-обёртка: все команды разработки (tsp, vite, npm, тесты) — в контейнере node:24.
# Причина: в WSL нет Linux-`node` (npm — Windows-обёртка), DrvFs /mnt/e медленный,
# а Linux-контейнер совпадает с прод-образом (нативные модули консистентны).
# Использование: ./scripts/dev.sh <cmd…>  (или docker compose -f docker-compose.dev.yml run --rm dev <cmd…>)
services:
  dev:
    image: node:24
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      # не мешать в неинтерактивном прогоне (npm update-notifier, color)
      - NO_COLOR=1
      # хостовые env доходят до контейнера только так: `PORT=3001 ./scripts/dev.sh …`
      # работает без правки этого файла; пустое значение сохраняет ветку
      # «PORT не задан» у сервера (решение §11.13 — падать с внятной ошибкой)
      - PORT=${PORT:-}
      - MOCK_PORT=${MOCK_PORT:-}
      - PRISM_PORT=${PRISM_PORT:-}
      - VITE_API_TARGET=${VITE_API_TARGET:-}
      - DATABASE_PATH=${DATABASE_PATH:-}
      - NOW=${NOW:-}
    stdin_open: true
    tty: true
    command: bash
