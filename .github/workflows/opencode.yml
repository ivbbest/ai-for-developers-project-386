name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.login == 'ivbbest' &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    # потолок на асинхронный агентский ответ висеть не должен: 60 мин с запасом
    # покрывает типовые /oc-задачи, висящий job не грел бы очередь
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@803d9eb7ad5f4dfd832d7506a7cad83ded52253e # v1.4.9
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          share: false