name: Contract sync

# Коммитить артефакт contract/dist/openapi.yaml — решение монорепо; значит,
# он обязан совпадать с тем, что генерирует компилятор из contract/*.tsp.
# Проверка: npm ci → tsp compile → git diff артефакта (красный при рассинхроне).
on:
  push:
    paths:
      - "contract/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/contract-sync.yml"
  pull_request:
    paths:
      - "contract/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/contract-sync.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      # та же среда, что dev-обёртка docker-compose.dev.yml (node:24)
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - name: Install workspace deps from lockfile
        run: npm ci
      - name: Compile TypeSpec (warn-as-error)
        run: npm run compile -w contract
      - name: Fail if the committed openapi.yaml is stale
        run: |
          git diff --exit-code -- contract/dist/openapi.yaml || {
            echo "::error::contract/dist/openapi.yaml расходится с contract/*.tsp — перегенерируйте: ./scripts/dev.sh npm run compile -w contract"
            exit 1
          }
